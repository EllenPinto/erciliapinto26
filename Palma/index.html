<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jorge Palma</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      header {
        grid-area: header-area;
        background-color: #236b65;
        color: white;
        padding: 15px;
        display: flex;
        align-items: center;
      }

      nav {
        grid-area: menu-area;
        background-color: #236b65;
        color: white;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        font-size: 0.85rem;
      }

      main {
        grid-area: main-area;
        background-color: #a63a3a;
        padding: 10px;
      }

      aside {
        grid-area: right-area;
        background-color: #318c28;
        color: white;
        padding: 15px;
      }

      footer {
        grid-area: footer-area;
        background-color: #8ca638;
        color: black;
        padding: 10px 15px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-areas:
          "header-area menu-area"
          "main-area   right-area"
          "footer-area footer-area";

        max-width: 800px;
        margin: 20px auto;
        border: 3px solid #6a0dad;
        font-family: Georgia, "Times New Roman", serif;
      }

      section {
        background-color: #de7272;
        color: white;
        padding: 12px;
        border: 1px solid #732222;
      }

      section h2,
      aside h2 {
        font-size: 1.1rem;
        margin-bottom: 6px;
      }

      section ul {
        margin-left: 20px;
      }

      header h1 {
        font-size: 1.4rem;
      }

      main section {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <header>
        <h1>Jorge Palma</h1>
      </header>

      <nav>
        <p>Uma homenagem ao cantor e compositor Jorge Palma!</p>
      </nav>

      <main>
        <section>
          <h2>Biografia</h2>
          <p>Nascido em lisboa em 1950.</p>
        </section>

        <section>
          <h2>Camções</h2>
          <ul>
            <li>Encosta-te a mim</li>
            <li>Deixa-me rir</li>
          </ul>
        </section>

        <section>
          <h2>Concertos</h2>
          <p>Toca por todo o país,muitas vezes acompanhado ao piano.</p>
        </section>
      </main>

      <aside>
        <h2>sabias que...</h2>
        <p>Gravou o primeiro disco em 1975.</p>
      </aside>

      <footer>
        <p>Lusófona - DIW</p>
      </footer>
    </section>
  </body>
</html>
